name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dashboard JavaScript syntax
        run: node --check app/static/app.js
      - name: Run tests in an isolated SQLite database
        run: python -m pytest -q

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full pipeline
        run: docker compose up --build -d
      - name: Verify Kafka worker writes scores to PostgreSQL
        run: python tests/smoke_compose.py
      - name: Show logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=150
      - name: Stop services
        if: always()
        run: docker compose down -v
