services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frauddb
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraudpass
    volumes:
      - fraud_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d frauddb"]
      interval: 5s
      timeout: 4s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - fraud_kafkadata:/var/lib/kafka/data

  api:
    build: .
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+psycopg2://fraud:fraudpass@postgres:5432/frauddb
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MODEL_DIR: /project/models
    volumes:
      - fraud_models:/project/models
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg2://fraud:fraudpass@postgres:5432/frauddb
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MODEL_DIR: /project/models
    volumes:
      - fraud_models:/project/models
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  streamlit:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - '8501:8501'
    environment:
      STREAMLIT_API_URL: http://api:8000
    depends_on:
      - api

volumes:
  fraud_pgdata:
  fraud_kafkadata:
  fraud_models:
